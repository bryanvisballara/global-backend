<!DOCTYPE html>
<html lang="es">
  <head>

  <body>
    <main class="client-shell">
      <section class="client-stage tracking-search-page">
        <div class="client-sheen"></div>
        <header class="page-topbar">
          <a class="secondary-button back-link" href="/client.html?view=tracking">Volver al portal</a>

        <section class="page-hero">

        <div id="feed-refresh-indicator" class="feed-refresh-indicator" aria-live="polite">
          <span id="feed-refresh-label">Desliza hacia abajo para actualizar</span>
        </div>

        <form id="tracking-page-form" class="tracking-search-card tracking-search-form">
          <label class="tracking-search-label" for="tracking-page-input">Número de guía</label>
          <input id="tracking-page-input" class="tracking-search-input" type="text" placeholder="Ej. GI-2026-001" autocomplete="off" />
          <button class="primary-button" type="submit">Rastrear</button>
          <p id="tracking-page-feedback" class="feedback" aria-live="polite"></p>
        </form>

        <div id="tracking-page-results" class="tracking-results"></div>

        <nav class="client-bottom-nav" aria-label="Navegacion principal del cliente">
          <button class="client-nav-button" type="button" data-nav-go="home" title="Inicio" aria-label="Inicio">
            <span class="client-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 4 3 11.2V20h6.2v-5.3h5.6V20H21v-8.8Z"></path></svg>
            </span>
            <span>Inicio</span>
          </button>
          <button class="client-nav-button is-active" type="button" data-nav-go="tracking" title="Seguimiento" aria-label="Seguimiento">
            <span class="client-nav-icon" aria-hidden="true">

          <button class="client-nav-button client-nav-button--create" type="button" data-nav-go="order" title="Nueva orden" aria-label="Nueva orden">
            <span class="client-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7Z"></path></svg>
            </span>
            <span>Orden</span>
          </button>
          <button class="client-nav-button" type="button" data-nav-go="maintenance" title="Mantenimiento" aria-label="Mantenimiento">
            <span class="client-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="m21.2 7.8-5-5-2.1 2.1 1.7 1.7-3 3-1.8-1.8-7.9 7.9 4.9 4.9 7.9-7.9-1.8-1.8 3-3 1.7 1.7ZM8 18.6l-2.1-2.1 5.1-5.1 2.1 2.1Z"></path></svg>

              <svg viewBox="0 0 24 24" focusable="false"><path d="M3 11.5 12 4l9 7.5v8.5h-6.5v-5H9.5v5H3v-8.5Zm2 1v5.5h2.5v-5H16.5v5H19v-5.5L12 6.6 5 12.5Z"></path></svg>

            <span>Autos</span>
