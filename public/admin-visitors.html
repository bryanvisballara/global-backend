<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Global Imports | Visitantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260802-posts-drafts01" />
    <link rel="stylesheet" href="/admin-mobile-fix.css?v=20260514-ipadsafe26" />
    <style>
      :root {
        --vis-gold: #a68246;
        --vis-gold-soft: rgba(166, 130, 70, 0.12);
        --vis-line: rgba(17, 17, 17, 0.1);
        --vis-muted: #6b7280;
        --vis-ink: #171717;
      }

      .vis-page {
        display: grid;
        gap: 1.15rem;
      }

      .vis-hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .vis-hero h1 {
        margin: 0;
      }

      .vis-hero .dashboard-lead {
        margin: 0.4rem 0 0;
        max-width: 42rem;
      }

      .vis-refresh-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        min-height: 44px;
        border: 1.5px solid var(--vis-gold);
        color: var(--vis-gold) !important;
        background: #fff;
        font-weight: 800;
        letter-spacing: 0.03em;
      }

      .vis-refresh-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        flex-shrink: 0;
      }

      .vis-card {
        background: #fff;
        border: 1px solid var(--vis-line);
        border-radius: 22px;
        padding: 1.35rem 1.4rem 1.5rem;
        box-shadow: 0 10px 28px rgba(20, 16, 10, 0.05);
      }

      .vis-section-title {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0 0 1.15rem;
        padding-bottom: 0.75rem;
        border-bottom: 2px solid var(--vis-gold);
        color: var(--vis-gold);
        font-family: Syne, Manrope, sans-serif;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .vis-section-title-icon {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--vis-gold-soft);
        color: var(--vis-gold);
        flex-shrink: 0;
      }

      .vis-section-title-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }

      .vis-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .vis-list-header .vis-section-title {
        margin: 0;
        padding: 0;
        border: 0;
        flex: 1;
      }

      .vis-count-pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0.2rem 0.75rem;
        border-radius: 999px;
        background: #f3f4f6;
        color: var(--vis-muted);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .vis-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem 1.15rem;
      }

      .vis-field {
        display: grid;
        gap: 0.4rem;
        min-width: 0;
      }

      .vis-field > span {
        font-size: 0.84rem;
        font-weight: 700;
        color: #374151;
      }

      .vis-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .vis-input-wrap svg {
        position: absolute;
        left: 0.9rem;
        width: 18px;
        height: 18px;
        stroke: var(--vis-gold);
        fill: none;
        stroke-width: 1.8;
        pointer-events: none;
        z-index: 1;
      }

      .vis-input-wrap input,
      .vis-input-wrap select,
      .vis-input-wrap textarea {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        min-height: 48px;
        border: 1.5px solid rgba(17, 17, 17, 0.12);
        border-radius: 14px;
        background: #fafafa;
        padding: 0.75rem 0.9rem 0.75rem 2.7rem;
        font: inherit;
        color: var(--vis-ink);
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .vis-input-wrap textarea {
        min-height: 96px;
        resize: vertical;
        padding-top: 0.85rem;
      }

      .vis-input-wrap select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--vis-gold) 50%),
          linear-gradient(135deg, var(--vis-gold) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) calc(50% - 3px),
          calc(100% - 12px) calc(50% - 3px);
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
        padding-right: 2.2rem;
      }

      .vis-input-wrap input:focus,
      .vis-input-wrap select:focus,
      .vis-input-wrap textarea:focus {
        outline: none;
        border-color: var(--vis-gold);
        background: #fff;
        box-shadow: 0 0 0 3px var(--vis-gold-soft);
      }

      .vis-field-span {
        grid-column: 1 / -1;
      }

      .vis-submit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 48px;
        padding: 0.8rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #c4a35a 0%, var(--vis-gold) 100%);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(166, 130, 70, 0.28);
      }

      .vis-submit svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .vis-table-wrap {
        overflow: auto;
        border: 1px solid var(--vis-line);
        border-radius: 16px;
      }

      .vis-table-wrap .tracking-data-table {
        margin: 0;
      }

      .vis-table-wrap .tracking-data-table thead th {
        background: #f3f4f6;
        color: #4b5563;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
      }

      .vis-empty {
        display: grid;
        place-items: center;
        gap: 0.65rem;
        padding: 2.4rem 1.25rem;
        color: var(--vis-muted);
        text-align: center;
      }

      .vis-empty svg {
        width: 42px;
        height: 42px;
        stroke: #c4c8d0;
        fill: none;
        stroke-width: 1.6;
      }

      .vis-empty p {
        margin: 0;
        max-width: 26rem;
        line-height: 1.45;
      }

      @media (max-width: 760px) {
        .vis-form-grid {
          grid-template-columns: 1fr;
        }

        .vis-card {
          padding: 1.1rem;
          border-radius: 18px;
        }

        .vis-submit {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="admin-app-view">
    <main class="dashboard-shell">
      <section class="dashboard-stage">
        <div class="dashboard-sheen"></div>
        <header class="page-topbar">
          <a class="secondary-button back-link" href="/app/admin.html">Volver al dashboard</a>
          <div class="page-topbar-actions">
            <div class="admin-badge">
              <span id="admin-name">Administrador</span>
              <strong id="admin-email">admin@globalimports.com</strong>
            </div>
            <button id="logout-button" class="secondary-button" type="button" onclick="window.__performAdminLogout?.(); return false;">Cerrar sesión</button>
          </div>
        </header>

        <section class="vis-page">
          <div class="vis-hero">
            <div>
              <h1>Registrar visita</h1>
              <p class="dashboard-lead">Completa los datos del visitante y el vehículo de interés.</p>
            </div>
            <button id="visitors-refresh" class="secondary-button vis-refresh-btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
              Actualizar lista
            </button>
          </div>
          <p id="visitors-feedback" class="feedback" aria-live="polite"></p>

          <article class="vis-card">
            <h2 class="vis-section-title">
              <span class="vis-section-title-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              Datos del visitante
            </h2>

            <form id="visitor-create-form" class="vis-form-grid">
              <label class="vis-field">
                <span>Nombre del visitante</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                  <input name="visitorName" required autocomplete="name" placeholder="Ingrese el nombre completo" />
                </span>
              </label>

              <label class="vis-field">
                <span>Teléfono</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  <input name="visitorPhone" inputmode="tel" autocomplete="tel" placeholder="Ingrese el número de teléfono" />
                </span>
              </label>

              <label class="vis-field">
                <span>Correo</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
                  <input name="visitorEmail" type="email" inputmode="email" autocomplete="email" placeholder="Ingrese el correo electrónico" />
                </span>
              </label>

              <label class="vis-field">
                <span>Documento</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.2"/><path d="M13 10h5M13 14h5"/></svg>
                  <input name="visitorDocument" placeholder="Ingrese el número de documento" />
                </span>
              </label>

              <label class="vis-field">
                <span>Fecha de visita</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                  <input name="visitDate" type="date" required />
                </span>
              </label>

              <label class="vis-field">
                <span>Hora</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                  <input name="visitTime" type="time" />
                </span>
              </label>

              <label class="vis-field">
                <span>Motivo</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                  <select name="purpose">
                    <option value="showroom">Ver vitrina / prueba</option>
                    <option value="delivery">Entrega</option>
                    <option value="pickup">Recogida</option>
                    <option value="other">Otro</option>
                  </select>
                </span>
              </label>

              <label class="vis-field">
                <span>Marca de interés</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
                  <input name="brand" placeholder="Ej. Toyota, BMW, Mercedes-Benz" />
                </span>
              </label>

              <label class="vis-field">
                <span>Modelo de interés</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h18l-1.5-4.5A2 2 0 0 0 17.6 7H6.4a2 2 0 0 0-1.9 1.5L3 13z"/><path d="M5 17h.01M19 17h.01"/><path d="M5 13v4a1 1 0 0 0 1 1h1.5"/><path d="M16.5 18H18a1 1 0 0 0 1-1v-4"/></svg>
                  <input name="model" placeholder="Ej. Sequoia, X5, GLE, etc." />
                </span>
              </label>

              <label class="vis-field">
                <span>Año</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                  <input name="year" inputmode="numeric" placeholder="Ej. 2025" />
                </span>
              </label>

              <label class="vis-field vis-field-span">
                <span>Notas</span>
                <span class="vis-input-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true" style="top:0.95rem;"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <textarea name="notes" rows="3" placeholder="Detalle de la visita (opcional)"></textarea>
                </span>
              </label>

              <div class="vis-field-span">
                <button class="vis-submit" type="submit">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                  Registrar visita
                </button>
              </div>
            </form>
          </article>

          <article class="vis-card">
            <div class="vis-list-header">
              <h2 class="vis-section-title">
                <span class="vis-section-title-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15" r="2"/><path d="M12 13v-1"/></svg>
                </span>
                Visitas programadas
              </h2>
              <span id="visitors-results-count" class="vis-count-pill">0 visita(s)</span>
            </div>

            <div class="vis-table-wrap tracking-table-wrap">
              <table class="tracking-data-table">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Visitante</th>
                    <th>Contacto</th>
                    <th>Interés</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="visitors-body">
                  <tr>
                    <td colspan="8">
                      <div class="vis-empty">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5l2 3h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"/></svg>
                        <p>Cargando visitantes…</p>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
        </section>
      </section>
    </main>

    <script src="/admin-common.js?v=20260802-posts-drafts01"></script>
    <script src="/admin-visitors.js?v=20260801-visitors02"></script>
  </body>
</html>
